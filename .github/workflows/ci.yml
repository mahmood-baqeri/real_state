name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: realestate_db
          POSTGRES_USER: realestate_user
          POSTGRES_PASSWORD: realestate_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realestate_user -d realestate_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgresql://realestate_user:realestate_pass@127.0.0.1:5432/realestate_test_db
      RATE_LIMIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r application/backend/requirements-dev.txt
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: realestate_pass
        run: psql -h 127.0.0.1 -U realestate_user -d realestate_db -c "CREATE DATABASE realestate_test_db OWNER realestate_user"
      - name: Run Django tests
        working-directory: application/backend/django_core
        run: python -m pytest
      - name: Run FastAPI tests
        working-directory: application/backend/fastapi_core
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: application/frontend
        run: npm test
      - name: Type-check frontend
        working-directory: application/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: application/frontend
        run: npm run build
